<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review mappings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page page-review">
      <section class="shell shell-review shell-simple">
        <header class="page-topbar page-topbar-compact">
          <div>
            <h1>Review mappings</h1>
            <p class="subtle-copy">Check each mapping and keep only what looks right.</p>
          </div>
          <a class="button-link button-small" href="/index.html">Upload another file</a>
        </header>

        <section id="stats" class="summary-strip" aria-label="Summary"></section>

        <section class="review-controls" aria-label="Review controls">
          <div class="controls-meta">
            <label class="field field-inline">
              <span>Show</span>
              <select id="filterStatus">
                <option value="all">All mappings</option>
                <option value="pending">Pending</option>
                <option value="auto_approved">Auto-approved</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
                <option value="edited">Edited</option>
              </select>
            </label>

            <label class="check check-muted">
              <input type="checkbox" id="exportAllowPartial" />
              <span>Allow partial export</span>
            </label>
          </div>

          <div class="controls-actions">
            <button type="button" id="btnExport" class="button-primary">Export JSON</button>
            <button type="button" id="btnCdm" class="button-secondary">Open CDM</button>
          </div>
        </section>

        <p id="actionStatus" class="table-status" aria-live="polite">Loading mappings...</p>

        <section class="table-shell mapping-table-shell" aria-label="Mappings">
          <div class="mapping-table-head">
            <span>Status</span>
            <span>FpML field</span>
            <span>Mapped to</span>
            <span>Rule</span>
            <span>Actions</span>
          </div>
          <section id="reviewList" class="mapping-table-body" aria-live="polite"></section>
        </section>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search)
      const uploadId = params.get('uploadId')
      const statsEl = document.getElementById('stats')
      const filterStatus = document.getElementById('filterStatus')
      const exportAllowPartial = document.getElementById('exportAllowPartial')
      const btnExport = document.getElementById('btnExport')
      const btnCdm = document.getElementById('btnCdm')
      const actionStatus = document.getElementById('actionStatus')
      const reviewList = document.getElementById('reviewList')
      const actionButtons = [btnExport, btnCdm]

      let rawProposals = []
      let displayRows = []
      let editingId = null
      let busy = false

      if (!uploadId) {
        setBusy(false, 'Missing upload id.')
        reviewList.innerHTML =
          '<div class="empty-state mapping-empty-state">This review link is missing an upload id.</div>'
      } else {
        load()
      }

      filterStatus.onchange = () => render()

      btnExport.onclick = async () => {
        if (!uploadId || busy) return

        setBusy(true, 'Exporting review package...')
        try {
          const response = await fetch('/api/export/' + encodeURIComponent(uploadId), {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ allowPartial: exportAllowPartial.checked }),
          })

          if (response.status === 422) {
            const json = await response.json().catch(() => ({}))
            setBusy(false, 'Review is incomplete.')
            alert(
              'INCOMPLETE_REVIEW - approve or reject all pending mappings, or enable partial export.\n' +
                (json.pendingProposalIds ? json.pendingProposalIds.length + ' pending ids.' : '')
            )
            return
          }

          if (!response.ok) {
            setBusy(false, 'Export failed.')
            alert('Export failed: ' + response.status + ' ' + (await response.text()))
            return
          }

          const json = await response.json()
          const blob = new Blob([JSON.stringify(json.package, null, 2)], {
            type: 'application/json',
          })
          const link = document.createElement('a')
          link.href = URL.createObjectURL(blob)
          link.download = 'rosetta-package-' + uploadId.slice(0, 8) + '.json'
          link.click()
          URL.revokeObjectURL(link.href)
          setBusy(false, 'Export complete.')
        } catch (error) {
          setBusy(false, 'Export failed.')
          alert('Export failed.')
        }
      }

      btnCdm.onclick = () => {
        if (!uploadId || busy) return
        setBusy(false, 'Opening CDM page...')
        window.location.href = '/cdm-orchestrator.html?uploadId=' + encodeURIComponent(uploadId)
      }

      async function load(successMessage) {
        if (!busy) setBusy(true, 'Loading mappings...')

        try {
          const response = await fetch('/api/review/' + encodeURIComponent(uploadId))
          const json = await response.json().catch(() => ({}))

          if (!response.ok) {
            reviewList.innerHTML =
              '<div class="empty-state mapping-empty-state">Could not load mappings.</div>'
            setBusy(false, 'Could not load mappings.')
            return
          }

          rawProposals = json.proposals || []
          buildStats()
          render()
          setBusy(false, successMessage || '')
        } catch (error) {
          reviewList.innerHTML =
            '<div class="empty-state mapping-empty-state">Could not load mappings.</div>'
          setBusy(false, 'Could not load mappings.')
        }
      }

      function buildStats() {
        const total = rawProposals.length
        const byStatus = {}

        rawProposals.forEach(proposal => {
          byStatus[proposal.status] = (byStatus[proposal.status] || 0) + 1
        })

        statsEl.innerHTML =
          summaryItem('Upload', uploadId ? uploadId.slice(0, 8) : '-') +
          summaryItem('Total', total) +
          summaryItem('Pending', byStatus.pending || 0) +
          summaryItem('Approved', (byStatus.approved || 0) + (byStatus.auto_approved || 0)) +
          summaryItem('Rejected', byStatus.rejected || 0)
      }

      function summaryItem(label, value) {
        return (
          '<div class="summary-item">' +
          '<span class="mapping-label">' +
          escapeHtml(String(label)) +
          '</span>' +
          '<strong>' +
          escapeHtml(String(value)) +
          '</strong>' +
          '</div>'
        )
      }

      function filterList(list) {
        const filter = filterStatus.value
        if (filter === 'all') return list
        return list.filter(proposal => proposal.status === filter)
      }

      function sortDisplay(list) {
        const order = {
          pending: 0,
          auto_approved: 1,
          edited: 2,
          approved: 3,
          rejected: 4,
        }

        return [...list].sort((a, b) => {
          const weightA = order[a.status] ?? 9
          const weightB = order[b.status] ?? 9
          if (weightA !== weightB) return weightA - weightB
          return Number(a.confidence) - Number(b.confidence)
        })
      }

      function render() {
        displayRows = sortDisplay(filterList(rawProposals))
        reviewList.innerHTML = ''

        if (!displayRows.length) {
          reviewList.innerHTML =
            '<div class="empty-state mapping-empty-state">No mappings in this view.</div>'
          return
        }

        displayRows.forEach((proposal, index) => {
          const row = document.createElement('article')
          const isEditing = editingId === proposal.id
          const statusClass = 'status-' + String(proposal.status)
          const payload = proposal.payload || {}
          const sourceField = payload.sourceField || {}

          row.className = 'mapping-row ' + statusClass
          row.innerHTML =
            '<div class="mapping-cell">' +
            '<div class="mapping-status-wrap">' +
            '<span class="status-pill ' +
            statusClass +
            '">' +
            escapeHtml(formatStatus(proposal.status)) +
            '</span>' +
            '<span class="confidence-pill">' +
            escapeHtml(String(Number(proposal.confidence))) +
            '</span>' +
            '</div>' +
            '</div>' +
            '<div class="mapping-cell">' +
            '<p class="mapping-value mono" title="' +
            escapeAttr(String(sourceField.path || '')) +
            '">' +
            escapeHtml(String(sourceField.path || '')) +
            '</p>' +
            '</div>' +
            '<div class="mapping-cell">' +
            renderTargetBlock(proposal, isEditing) +
            '</div>' +
            '<div class="mapping-cell">' +
            renderRuleBlock(proposal, isEditing) +
            '</div>' +
            '<div class="mapping-cell mapping-actions-cell">' +
            renderActions(proposal, isEditing) +
            '</div>'

          wireRowActions(row, proposal, isEditing)
          reviewList.appendChild(row)
        })
      }

      function renderTargetBlock(proposal, isEditing) {
        if (!isEditing) {
          return (
            '<p class="mapping-value mono" title="' +
            escapeAttr(String(proposal.cdmPath || '')) +
            '">' +
            escapeHtml(String(proposal.cdmPath || '')) +
            '</p>'
          )
        }

        return (
          '<div class="inline-editor inline-editor-compact">' +
          '<input class="inline-inp mono inline-inp-compact" data-f="cdm" value="' +
          escapeAttr(proposal.cdmPath || '') +
          '" placeholder="CDM path" />' +
          '</div>'
        )
      }

      function renderRuleBlock(proposal, isEditing) {
        if (!isEditing) {
          const payload = proposal.payload || {}
          const cookbookFamily = payload.cookbookFamily || '-'
          const ruleIds = Array.isArray(payload.cookbookRuleIds)
            ? payload.cookbookRuleIds.slice(0, 3).join(', ')
            : ''
          const assumptionCount = Array.isArray(payload.assumptionNotes) ? payload.assumptionNotes.length : 0
          return (
            '<div>' +
            '<p class="mapping-value mapping-rule-text" title="' +
            escapeAttr(String(proposal.transformation || 'Direct mapping')) +
            '">' +
            escapeHtml(String(proposal.transformation || 'Direct mapping')) +
            '</p>' +
            '<p class="mapping-rule-text subtle-copy">Cookbook: ' +
            escapeHtml(String(cookbookFamily)) +
            (ruleIds ? ' | Rules: ' + escapeHtml(ruleIds) : '') +
            (assumptionCount > 0 ? ' | Assumptions: ' + escapeHtml(String(assumptionCount)) : '') +
            '</p>' +
            '</div>'
          )
        }

        return (
          '<div class="inline-editor inline-editor-compact">' +
          '<input class="inline-inp inline-inp-compact" data-f="tx" value="' +
          escapeAttr(proposal.transformation || '') +
          '" placeholder="Rule" />' +
          '</div>'
        )
      }

      function renderActions(proposal, isEditing) {
        if (isEditing) {
          return (
            '<div class="actions actions-compact">' +
            '<button type="button" class="button-primary icon-button action-save" aria-label="Save">&#10003;</button>' +
            '<button type="button" class="button-secondary icon-button action-cancel" aria-label="Cancel">&#10005;</button>' +
            '</div>'
          )
        }

        const buttons = []

        if (proposal.status === 'pending') {
          buttons.push(
            '<button type="button" class="button-primary icon-button action-approve" aria-label="Approve">&#10003;</button>'
          )
          buttons.push(
            '<button type="button" class="button-secondary icon-button action-reject" aria-label="Reject">&#10005;</button>'
          )
          buttons.push(
            '<button type="button" class="button-ghost button-small action-edit">Edit</button>'
          )
        } else if (proposal.status === 'auto_approved') {
          buttons.push(
            '<button type="button" class="button-ghost button-small action-edit">Edit</button>'
          )
        } else if (proposal.status !== 'rejected') {
          buttons.push(
            '<button type="button" class="button-ghost button-small action-edit">Edit</button>'
          )
        }

        return '<div class="actions actions-compact">' + buttons.join('') + '</div>'
      }

      function wireRowActions(row, proposal, isEditing) {
        if (isEditing) {
          row.querySelector('.action-save').onclick = () => saveEdit(row, proposal)
          row.querySelector('.action-cancel').onclick = () => {
            editingId = null
            render()
          }
          return
        }

        const approveBtn = row.querySelector('.action-approve')
        const rejectBtn = row.querySelector('.action-reject')
        const editBtn = row.querySelector('.action-edit')

        if (approveBtn) approveBtn.onclick = () => patch('approve', proposal.id)
        if (rejectBtn) rejectBtn.onclick = () => patch('reject', proposal.id)
        if (editBtn) {
          editBtn.onclick = () => {
            editingId = proposal.id
            render()
          }
        }
      }

      async function saveEdit(row, proposal) {
        if (busy) return

        const cdmPath = row.querySelector('[data-f=cdm]').value
        const transformation = row.querySelector('[data-f=tx]').value

        setBusy(true, 'Saving edit...')
        try {
          const response = await fetch(
            '/api/review/proposals/' + encodeURIComponent(proposal.id) + '/edit',
            {
              method: 'PATCH',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                cdmPath,
                transformation,
                notes: 'edited in UI',
              }),
            }
          )

          if (!response.ok) {
            setBusy(false, 'Edit failed.')
            alert('Edit failed.')
            return
          }

          editingId = null
          await load('Edit saved.')
        } catch (error) {
          setBusy(false, 'Edit failed.')
          alert('Edit failed.')
        }
      }

      async function patch(kind, proposalId) {
        if (busy) return

        setBusy(true, kind === 'approve' ? 'Approving mapping...' : 'Rejecting mapping...')
        try {
          const path =
            kind === 'approve'
              ? '/api/review/proposals/' + encodeURIComponent(proposalId) + '/approve'
              : '/api/review/proposals/' + encodeURIComponent(proposalId) + '/reject'

          const body =
            kind === 'approve'
              ? JSON.stringify({ notes: 'approved in UI' })
              : JSON.stringify({ correction: 'rejected in UI', notes: '' })

          const response = await fetch(path, {
            method: 'PATCH',
            headers: { 'content-type': 'application/json' },
            body,
          })

          if (!response.ok) {
            setBusy(false, 'Update failed.')
            alert('Update failed: ' + response.status)
            return
          }

          editingId = null
          await load(kind === 'approve' ? 'Mapping approved.' : 'Mapping rejected.')
        } catch (error) {
          setBusy(false, 'Update failed.')
          alert('Update failed.')
        }
      }

      function setBusy(nextBusy, message) {
        busy = nextBusy
        actionStatus.textContent = message
        actionStatus.classList.toggle('is-loading', nextBusy)
        actionButtons.forEach(button => {
          button.disabled = nextBusy
        })
        filterStatus.disabled = nextBusy
        exportAllowPartial.disabled = nextBusy
      }

      function formatStatus(status) {
        return String(status).replace(/_/g, ' ')
      }

      function escapeAttr(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
      }

      function escapeHtml(value) {
        return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }
    </script>
  </body>
</html>
