<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Review mappings</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Review proposals</h1>
      <p><a href="/index.html">← Upload</a></p>

      <section id="stats" class="stats" aria-label="Summary"></section>

      <div class="toolbar">
        <label
          >Filter
          <select id="filterStatus">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="auto_approved">Auto-approved</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="edited">Edited</option>
          </select>
        </label>
        <label class="check"
          ><input type="checkbox" id="selectAllPending" /> Select all pending</label
        >
        <button type="button" id="btnBatchApprove">Approve selected</button>
        <button type="button" id="btnBatchReject" class="secondary">Reject selected</button>
        <button type="button" id="btnApproveHigh" title="Pending rows with confidence ≥ 80">
          Approve pending ≥ 80
        </button>
        <label class="check" title="If unchecked, export fails while any proposal is still pending"
          ><input type="checkbox" id="exportAllowPartial" /> Allow partial export</label
        >
        <button type="button" id="btnExport">Download export JSON</button>
        <span id="shortcuts" class="hint"
          ><kbd>j</kbd>/<kbd>k</kbd> move · <kbd>a</kbd> approve · <kbd>r</kbd> reject ·
          <kbd>e</kbd> edit · <kbd>Shift+A</kbd> approve selected</span
        >
      </div>

      <p id="meta"></p>
      <table id="tbl" class="tbl">
        <thead>
          <tr>
            <th class="col-check"></th>
            <th>Path</th>
            <th>CDM</th>
            <th>Skill</th>
            <th>Conf</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search)
      const uploadId = params.get('uploadId')
      const meta = document.getElementById('meta')
      const tbody = document.querySelector('#tbl tbody')
      const statsEl = document.getElementById('stats')
      const filterStatus = document.getElementById('filterStatus')
      let rawProposals = []
      let focusedIdx = -1
      let displayRows = []

      if (!uploadId) {
        meta.textContent = 'Missing uploadId in query string.'
      } else {
        load()
      }

      filterStatus.onchange = () => render()
      document.getElementById('selectAllPending').onchange = e => {
        const on = e.target.checked
        displayRows.forEach((p, i) => {
          if (p.status === 'pending') {
            const cb = tbody.rows[i]?.querySelector('input.row-check')
            if (cb) cb.checked = on
          }
        })
      }
      document.getElementById('btnBatchApprove').onclick = () =>
        batchAction('approve', collectCheckedIds())
      document.getElementById('btnBatchReject').onclick = () =>
        batchAction('reject', collectCheckedIds())
      document.getElementById('btnApproveHigh').onclick = () => {
        const ids = displayRows
          .filter(p => p.status === 'pending' && Number(p.confidence) >= 80)
          .map(p => p.id)
        batchAction('approve', ids)
      }
      document.getElementById('btnExport').onclick = async () => {
        if (!uploadId) return
        const allowPartial = document.getElementById('exportAllowPartial').checked
        const r = await fetch('/api/export/' + encodeURIComponent(uploadId), {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ allowPartial }),
        })
        if (r.status === 422) {
          const j = await r.json().catch(() => ({}))
          alert(
            'INCOMPLETE_REVIEW — approve/reject all pending or enable "Allow partial export".\n' +
              (j.pendingProposalIds ? j.pendingProposalIds.length + ' pending ids.' : '')
          )
          return
        }
        if (!r.ok) {
          alert('Export failed: ' + r.status + ' ' + (await r.text()))
          return
        }
        const j = await r.json()
        const blob = new Blob([JSON.stringify(j.package, null, 2)], { type: 'application/json' })
        const a = document.createElement('a')
        a.href = URL.createObjectURL(blob)
        a.download = 'rosetta-package-' + uploadId.slice(0, 8) + '.json'
        a.click()
        URL.revokeObjectURL(a.href)
      }

      function collectCheckedIds() {
        const ids = []
        tbody.querySelectorAll('input.row-check:checked').forEach(cb => ids.push(cb.dataset.id))
        return ids
      }

      async function batchAction(action, proposalIds) {
        if (!proposalIds.length) return
        const r = await fetch('/api/review/' + encodeURIComponent(uploadId) + '/batch', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            action,
            proposalIds,
            notes: action === 'approve' ? 'batch approve' : '',
            correction: action === 'reject' ? 'batch reject' : undefined,
          }),
        })
        if (!r.ok) {
          alert('batch failed: ' + (await r.text()))
          return
        }
        await load()
      }

      async function load() {
        meta.textContent = 'Loading…'
        const r = await fetch('/api/review/' + encodeURIComponent(uploadId))
        const j = await r.json()
        if (!r.ok) {
          meta.textContent = 'Error'
          return
        }
        rawProposals = j.proposals || []
        meta.textContent = 'Upload: ' + uploadId + ' — ' + rawProposals.length + ' proposals'
        buildStats()
        render()
      }

      function buildStats() {
        const n = rawProposals.length
        const by = {}
        let sumC = 0
        const skills = {}
        rawProposals.forEach(p => {
          by[p.status] = (by[p.status] || 0) + 1
          sumC += Number(p.confidence) || 0
          const s = p.skillInvoked || 'unknown'
          skills[s] = (skills[s] || 0) + 1
        })
        const avg = n ? (sumC / n).toFixed(1) : '—'
        const skillStr = Object.entries(skills)
          .sort((a, b) => b[1] - a[1])
          .map(([k, v]) => k + ': ' + v)
          .join(' · ')
        statsEl.innerHTML =
          '<div class="statcards">' +
          '<span class="badge">Total <strong>' +
          n +
          '</strong></span>' +
          '<span class="badge">Pending <strong>' +
          (by['pending'] || 0) +
          '</strong></span>' +
          '<span class="badge">Auto <strong>' +
          (by['auto_approved'] || 0) +
          '</strong></span>' +
          '<span class="badge">Approved <strong>' +
          (by['approved'] || 0) +
          '</strong></span>' +
          '<span class="badge">Rejected <strong>' +
          (by['rejected'] || 0) +
          '</strong></span>' +
          '<span class="badge">Edited <strong>' +
          (by['edited'] || 0) +
          '</strong></span>' +
          '<span class="badge">Avg conf <strong>' +
          avg +
          '</strong></span>' +
          '</div>' +
          (skillStr ? '<p class="skill-dist">' + escapeHtml(skillStr) + '</p>' : '')
      }

      function filterList(list) {
        const f = filterStatus.value
        if (f === 'all') return list
        return list.filter(p => p.status === f)
      }

      function sortDisplay(list) {
        return [...list].sort((a, b) => {
          const nr = (b.needsReview ? 1 : 0) - (a.needsReview ? 1 : 0)
          if (nr !== 0) return nr
          return Number(a.confidence) - Number(b.confidence)
        })
      }

      function rowClass(p) {
        if (p.status === 'auto_approved') return 'row-auto'
        if (p.status === 'rejected') return 'row-reject'
        if (p.status === 'edited' || p.status === 'approved') return 'row-ok'
        if (p.status === 'pending' && p.needsReview) return 'row-warn'
        return 'row-pending'
      }

      function render() {
        displayRows = sortDisplay(filterList(rawProposals))
        tbody.innerHTML = ''
        displayRows.forEach((p, idx) => {
          const row = document.createElement('tr')
          row.className = rowClass(p)
          row.dataset.idx = String(idx)
          const pl = p.payload || {}
          const sf = pl.sourceField || {}
          const cdm = escapeHtml(String(p.cdmPath || ''))
          const pending = p.status === 'pending'
          const auto = p.status === 'auto_approved'
          row.innerHTML =
            '<td class="col-check">' +
            (pending
              ? '<input type="checkbox" class="row-check" data-id="' +
                escapeHtml(p.id) +
                '" />'
              : '') +
            '</td>' +
            '<td><code>' +
            escapeHtml(String(sf.path || '')) +
            '</code></td>' +
            '<td class="cdm-cell"><code class="cdm-display">' +
            cdm +
            '</code></td>' +
            '<td>' +
            escapeHtml(String(p.skillInvoked || '')) +
            '</td>' +
            '<td>' +
            Number(p.confidence) +
            '</td>' +
            '<td>' +
            escapeHtml(String(p.status || '')) +
            '</td>' +
            '<td class="actions"></td>'
          const actions = row.querySelector('.actions')
          if (pending) {
            addBtn(actions, 'Approve', () => patch('approve', p.id))
            addBtn(actions, 'Reject', () => patch('reject', p.id), 'secondary')
          }
          if (pending || auto) {
            addBtn(actions, 'Edit', () => startEdit(p, row), 'ghost')
          }
          tbody.appendChild(row)
        })
        focusedIdx = displayRows.length ? 0 : -1
        updateFocus()
      }

      function addBtn(parent, label, onClick, cls) {
        const b = document.createElement('button')
        b.type = 'button'
        b.textContent = label
        if (cls) b.className = cls
        b.onclick = e => {
          e.stopPropagation()
          onClick()
        }
        parent.appendChild(b)
      }

      function startEdit(p, row) {
        const cell = row.querySelector('.cdm-cell')
        const cur = p.cdmPath || ''
        const curT = p.transformation || ''
        cell.innerHTML =
          '<input class="inline-inp" data-f="cdm" value="' +
          escapeAttr(cur) +
          '" /><br/>' +
          '<input class="inline-inp" data-f="tx" value="' +
          escapeAttr(curT) +
          '" />' +
          '<button type="button" class="save-edit">Save</button>' +
          '<button type="button" class="cancel-edit secondary">Cancel</button>'
        cell.querySelector('.save-edit').onclick = async () => {
          const cdm = cell.querySelector('[data-f=cdm]').value
          const tx = cell.querySelector('[data-f=tx]').value
          const r = await fetch('/api/review/proposals/' + encodeURIComponent(p.id) + '/edit', {
            method: 'PATCH',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ cdmPath: cdm, transformation: tx, notes: 'edited in UI' }),
          })
          if (!r.ok) {
            alert('edit failed')
            return
          }
          await load()
        }
        cell.querySelector('.cancel-edit').onclick = () => render()
      }

      function escapeAttr(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
      }

      async function patch(kind, proposalId) {
        const path =
          kind === 'approve'
            ? '/api/review/proposals/' + encodeURIComponent(proposalId) + '/approve'
            : '/api/review/proposals/' + encodeURIComponent(proposalId) + '/reject'
        const body =
          kind === 'approve'
            ? JSON.stringify({ notes: 'approved in UI' })
            : JSON.stringify({ correction: 'rejected in UI', notes: '' })
        const r = await fetch(path, {
          method: 'PATCH',
          headers: { 'content-type': 'application/json' },
          body,
        })
        if (!r.ok) {
          alert('failed: ' + r.status)
          return
        }
        await load()
      }

      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }

      document.addEventListener('keydown', e => {
        if (e.target.matches('input, textarea, select')) return
        if (!displayRows.length) return
        if (e.key === 'j') {
          e.preventDefault()
          focusedIdx = Math.min(focusedIdx + 1, displayRows.length - 1)
          updateFocus()
        }
        if (e.key === 'k') {
          e.preventDefault()
          focusedIdx = Math.max(focusedIdx - 1, 0)
          updateFocus()
        }
        const pid = displayRows[focusedIdx]?.id
        if (e.key === 'a' && !e.shiftKey && pid) {
          e.preventDefault()
          patch('approve', pid)
        }
        if (e.key === 'r' && pid) {
          e.preventDefault()
          patch('reject', pid)
        }
        if (e.key === 'e' && pid) {
          e.preventDefault()
          const row = tbody.rows[focusedIdx]
          if (row) startEdit(displayRows[focusedIdx], row)
        }
        if (e.shiftKey && (e.key === 'a' || e.key === 'A')) {
          e.preventDefault()
          document.getElementById('btnBatchApprove').click()
        }
      })

      function updateFocus() {
        ;[...tbody.rows].forEach((r, i) => {
          r.classList.toggle('row-focus', i === focusedIdx)
        })
      }
    </script>
  </body>
</html>
