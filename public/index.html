<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FpML to CDM Mapping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page page-upload">
      <section class="shell shell-upload">
        <section class="surface-hero">
          <div class="upload-intro">
            <h1>FpML to CDM Mapping</h1>
            <p class="subtle-copy">upload the FpML file you want to convert</p>
          </div>

          <div class="stack-form">
            <input
              type="file"
              id="file"
              class="sr-only"
              accept=".xml,.json,application/xml,text/xml,application/json"
            />

            <label for="file" id="fileDropzone" class="dropzone dropzone-dark">
              <span class="dropzone-title">Upload file</span>
              <span class="dropzone-copy">Click to upload or drag and drop</span>
            </label>

            <p id="selectedFile" class="file-chip" aria-live="polite"></p>
            <div id="statusLine" class="status-line" data-state="idle">
              <p id="status" class="status-text">Choose an XML or JSON file to begin.</p>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script>
      const fileInput = document.getElementById('file')
      const fileDropzone = document.getElementById('fileDropzone')
      const selectedFile = document.getElementById('selectedFile')
      const status = document.getElementById('status')
      const statusLine = document.getElementById('statusLine')

      let isUploading = false

      fileInput.addEventListener('change', () => {
        const file = fileInput.files?.[0]
        if (file) handleFileSelection(file)
      })

      ;['dragenter', 'dragover'].forEach(eventName => {
        fileDropzone.addEventListener(eventName, event => {
          event.preventDefault()
          if (!isUploading) fileDropzone.classList.add('is-dragging')
        })
      })

      ;['dragleave', 'drop'].forEach(eventName => {
        fileDropzone.addEventListener(eventName, event => {
          event.preventDefault()
          fileDropzone.classList.remove('is-dragging')
        })
      })

      fileDropzone.addEventListener('drop', event => {
        const droppedFile = event.dataTransfer?.files?.[0]
        if (!droppedFile || isUploading) return
        const transfer = new DataTransfer()
        transfer.items.add(droppedFile)
        fileInput.files = transfer.files
        handleFileSelection(droppedFile)
      })

      async function handleFileSelection(file) {
        const formatType = detectFormat(file)
        const sizeKb = Math.max(1, Math.round(file.size / 1024))

        selectedFile.textContent =
          file.name +
          ' / ' +
          sizeKb +
          ' KB' +
          (formatType ? ' / ' + formatType.toUpperCase() : ' / Unsupported format')

        if (!formatType) {
          setStatus('error', 'Only .xml and .json files are supported right now.')
          return
        }

        if (isUploading) return

        isUploading = true
        fileDropzone.classList.add('is-disabled')
        setStatus('loading', 'Uploading file...')

        try {
          const fd = new FormData()
          fd.set('formatType', formatType)
          fd.set('file', file)

          const uploadResponse = await fetch('/api/upload', { method: 'POST', body: fd })
          const uploadJson = await uploadResponse.json().catch(() => ({}))

          if (!uploadResponse.ok) {
            setStatus('error', 'Upload failed: ' + (uploadJson.error || uploadResponse.status))
            resetIdleState()
            return
          }

          setStatus('loading', 'Generating mapping candidates...')

          const mappingResponse = await fetch('/api/mapping', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ uploadId: uploadJson.uploadId }),
          })
          const mappingJson = await mappingResponse.json().catch(() => ({}))

          if (!mappingResponse.ok) {
            setStatus('error', 'Mapping failed: ' + (mappingJson.error || mappingResponse.status))
            resetIdleState()
            return
          }

          setStatus('success', 'Opening review...')
          window.location.href = '/review.html?uploadId=' + encodeURIComponent(uploadJson.uploadId)
        } catch (error) {
          setStatus('error', 'Something went wrong while generating mappings.')
          resetIdleState()
        }
      }

      function resetIdleState() {
        isUploading = false
        fileDropzone.classList.remove('is-disabled')
      }

      function setStatus(state, message) {
        statusLine.dataset.state = state
        status.textContent = message
      }

      function detectFormat(file) {
        const name = String(file.name || '').toLowerCase()
        const type = String(file.type || '').toLowerCase()

        if (name.endsWith('.xml') || type.includes('xml')) return 'xml'
        if (name.endsWith('.json') || type.includes('json')) return 'json'

        return null
      }
    </script>
  </body>
</html>
